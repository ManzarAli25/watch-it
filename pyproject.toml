[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watch-mcp"
version = "0.2.1"
description = "MCP server that gives AI coding agents eyes — turns videos into structured timeline events."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Watch" }]
dependencies = [
    "mcp>=1.2.0",
    "yt-dlp>=2024.1.0",
    # Pinned below 5.0: the 5.0.0.93 wheels ship a cv2/ that collides with the
    # non-headless package and drag in numpy>=2.5, a combination whose native
    # extension load can wedge indefinitely inside a running MCP server.
    "opencv-python-headless>=4.9.0,<5",
    "imageio-ffmpeg>=0.5.1",
    "scenedetect>=0.6.4",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "Pillow>=10.2",
    "python-dotenv>=1.0",
    "platformdirs>=4.0",
    "typer>=0.15",
    "textual>=0.60",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
watch-mcp = "watch_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
watch_mcp = ["assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
